name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pkgs/**', 'common/**', 'builder', 'sign', 'autobuild', '.github/workflows/build.yml']

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  ARCHS: x86_64
  PKGS_DIR: ./pkgs
  REPO_DIR: ./repo
  EXTRA_ARGS: -C
  SIGNED_BY: "slut saint <manthan2007matrick@gmail.com>"
  RELEASE_TAG: repo
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
    steps:
      - name: install tools
        run: |
          xbps-install -Syu || xbps-install -Syu
          xbps-install -Sy git curl bash xtools util-linux jq nodejs github-cli openssl xbps
          useradd -M builder
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: prepare release and download already-built packages
        run: |
          mkdir -p repo/binpkgs
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "XBPS repo" --notes "Binary package repository. Do not download by hand."
          gh release download "$RELEASE_TAG" --dir repo/binpkgs --clobber || echo "nothing published yet"
          rm -f repo/binpkgs/last-build.log

      - name: find packages that are not built yet
        run: |
          ./unbuilt_packages > .list || true
          cat .list
          echo "TO_BUILD=$(cut -d: -f2 .list | sort -u | tr '\n' ' ')" >> "$GITHUB_ENV"
          mkdir -p .to_build
          for arch in $ARCHS; do grep "^$arch:" .list > .to_build/"$arch" || :; done

      - name: lint templates
        if: env.TO_BUILD != ''
        run: for p in $TO_BUILD; do xlint pkgs/$p/template; done

      - name: allow user namespaces (xbps-src sandbox needs them)
        run: |
          echo "before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1)"
          echo 0 > /proc/sys/kernel/apparmor_restrict_unprivileged_userns || echo "could not change it"
          echo "after: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1)"
          echo "max_user_namespaces: $(cat /proc/sys/user/max_user_namespaces 2>&1)"

      - name: build (as non-root, signing key NOT available)
        if: env.TO_BUILD != ''
        shell: bash
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          bash ./autobuild

      - name: sign and index
        if: env.BUILT_ANY == 'true'
        env:
          SIGN_KEY_B64: ${{ secrets.SIGN_KEY }}
        run: |
          echo -n "$SIGN_KEY_B64" | base64 -d > /tmp/key.pem
          SIGN_KEY=/tmp/key.pem ./sign
          rm -f /tmp/key.pem

      - name: publish
        if: env.BUILT_ANY == 'true'
        run: |
          cd repo/binpkgs
          gh release upload "$RELEASE_TAG" ./*.xbps ./*.sig2 ./*-repodata --clobber

      - name: record auto-fixed templates in the repo
        if: env.AUTOFIXED == 'true'
        continue-on-error: true
        run: |
          git config user.name "repo-bot"
          git config user.email "repo-bot@users.noreply.github.com"
          git add pkgs
          git commit -m "[auto-fix] add missing makedepends" -m "$(cat .autofixed)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: publish build report
        if: always() && env.TO_BUILD != ''
        continue-on-error: true
        run: |
          cp build-report.txt last-build.log
          gh release upload "$RELEASE_TAG" last-build.log --clobber

      - name: fail the run if any package could not be built
        if: env.TO_BUILD != ''
        run: |
          if [ -s .failed ]; then
            echo "These packages failed (details in last-build.log on the release):"
            cat .failed
            exit 1
          fi
