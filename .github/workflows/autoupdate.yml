name: autoupdate
on:
  schedule:
    # GitHub delays or drops scheduled runs, worst at the start of the hour, so
    # two off-peak minutes. This is the backup; an external pinger can also
    # start this workflow through workflow_dispatch below.
    - cron: '17 * * * *'
    - cron: '47 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: autoupdate
  cancel-in-progress: false

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: keep schedule alive (resets the 60-day timer)
        env:
          GH_TOKEN: ${{ github.token }}
        run: if [ "$(date +%u-%H)" = "1-03" ]; then gh workflow enable autoupdate.yml; fi
      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y fish jq
      - name: check upstream for new versions
        id: updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./autoupdate.fish
      - name: commit and trigger build
        if: ${{ steps.updates.outputs.updates != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES: ${{ steps.updates.outputs.updates }}
        run: |
          git config user.name "repo-bot"
          git config user.email "repo-bot@users.noreply.github.com"
          git add -A pkgs common
          git commit -m "[automated] update packages" -m "$UPDATES"
          git push
          # pushes made with GITHUB_TOKEN don't start other workflows, so start the build explicitly
          gh workflow run build.yml --ref "${GITHUB_REF_NAME}"
      - name: fail the run if an upstream check failed
        if: ${{ steps.updates.outputs.failed == '1' }}
        run: |
          echo "::error::an upstream version check failed, see the 'check upstream for new versions' step"
          exit 1
