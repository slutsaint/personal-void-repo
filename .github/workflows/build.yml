name: build
on:
  workflow_dispatch:
    inputs:
      attempt:
        description: "internal retry counter (leave as 1)"
        required: false
        default: "1"
  push:
    branches: [main]
    paths: ['pkgs/**', 'common/**', 'builder', 'sign', 'autobuild', '.github/workflows/build.yml']

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

env:
  ARCHS: x86_64
  PKGS_DIR: ./pkgs
  REPO_DIR: ./repo
  EXTRA_ARGS: -C
  SIGNED_BY: "slut saint <manthan2007matrick@gmail.com>"
  RELEASE_TAG: repo
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    outputs:
      pkg_failed: ${{ steps.result.outputs.pkg_failed }}
    container:
      image: ghcr.io/void-linux/void-glibc-full:latest
      options: --privileged
    steps:
      - name: install tools (retries, falls back to other Void mirrors)
        run: |
          set +e
          ok=0
          for i in 1 2 3 4 5; do
            if xbps-install -Syu || xbps-install -Syu; then ok=1; break; fi
            echo "::warning::xbps update failed (attempt $i of 5)"
            case $i in
              2) m=https://repo-fastly.voidlinux.org/current ;;
              3) m=https://repo-de-fra.voidlinux.org/current ;;
              4) m=https://repo-fastly.voidlinux.org/current ;;
              *) m= ;;
            esac
            if [ -n "$m" ]; then
              mkdir -p /etc/xbps.d
              echo "repository=$m" > /etc/xbps.d/00-repository-main.conf
              echo "now using mirror $m"
            fi
            sleep $((i * 20))
          done
          [ "$ok" = 1 ] || { echo "xbps update failed 5 times, giving up"; exit 1; }
          ok=0
          for i in 1 2 3; do
            if xbps-install -Sy git curl bash xtools util-linux jq nodejs github-cli openssl xbps; then ok=1; break; fi
            sleep $((i * 20))
          done
          [ "$ok" = 1 ] || { echo "tool install failed 3 times, giving up"; exit 1; }
          useradd -M builder
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v4

      - name: prepare release and download already-built packages
        run: |
          mkdir -p repo/binpkgs
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "XBPS repo" --notes "Binary package repository. Do not download by hand."
          gh release download "$RELEASE_TAG" --dir repo/binpkgs --clobber || echo "nothing published yet"
          rm -f repo/binpkgs/last-build.log

      - name: find packages that are not built yet
        run: |
          ./unbuilt_packages > .list || true
          cat .list
          echo "TO_BUILD=$(cut -d: -f2 .list | sort -u | tr '\n' ' ')" >> "$GITHUB_ENV"
          mkdir -p .to_build
          for arch in $ARCHS; do grep "^$arch:" .list > .to_build/"$arch" || :; done

      - name: lint templates
        if: env.TO_BUILD != ''
        run: for p in $TO_BUILD; do xlint pkgs/$p/template; done

      - name: allow user namespaces (xbps-src sandbox needs them)
        run: |
          echo "before: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1)"
          echo 0 > /proc/sys/kernel/apparmor_restrict_unprivileged_userns || echo "could not change it"
          echo "after: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>&1)"
          echo "max_user_namespaces: $(cat /proc/sys/user/max_user_namespaces 2>&1)"

      - name: build (as non-root, signing key NOT available)
        if: env.TO_BUILD != ''
        shell: bash
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE"
          bash ./autobuild

      - name: sign and index
        if: env.BUILT_ANY == 'true'
        env:
          SIGN_KEY_B64: ${{ secrets.SIGN_KEY }}
        run: |
          echo -n "$SIGN_KEY_B64" | base64 -d > /tmp/key.pem
          SIGN_KEY=/tmp/key.pem ./sign
          rm -f /tmp/key.pem

      - name: publish
        if: env.BUILT_ANY == 'true'
        run: |
          cd repo/binpkgs
          gh release upload "$RELEASE_TAG" ./*.xbps ./*.sig2 ./*-repodata --clobber

      - name: record auto-fixed templates in the repo
        if: env.AUTOFIXED == 'true'
        continue-on-error: true
        run: |
          git config user.name "repo-bot"
          git config user.email "repo-bot@users.noreply.github.com"
          git add pkgs
          git commit -m "[auto-fix] add missing makedepends" -m "$(cat .autofixed)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: publish build report
        if: always() && env.TO_BUILD != ''
        continue-on-error: true
        run: |
          cp build-report.txt last-build.log
          gh release upload "$RELEASE_TAG" last-build.log --clobber

      - name: record whether a package itself failed
        id: result
        if: always()
        run: |
          # pkg_failed=true means "a package really failed to build" (do NOT retry the run).
          # Network-caused failures are left unset, so the retry job below can try again.
          if [ -s .failed ] && [ ! -s .network_failed ]; then
            echo "pkg_failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: fail the run if any package could not be built
        if: env.TO_BUILD != ''
        run: |
          if [ -s .failed ]; then
            echo "These packages failed (details in last-build.log on the release):"
            cat .failed
            exit 1
          fi

  retry:
    # If the run failed for infrastructure reasons (mirror down, network), try again
    # later: at most 3 runs in total. Real package failures are NOT retried.
    needs: build
    if: always() && needs.build.result == 'failure' && needs.build.outputs.pkg_failed != 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    steps:
      - name: dispatch another attempt
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.event.inputs.attempt || '1' }}
        run: |
          if [ "$ATTEMPT" -ge 3 ]; then
            echo "attempt $ATTEMPT was the last allowed one, giving up"
            exit 0
          fi
          echo "attempt $ATTEMPT failed for infrastructure reasons; waiting 10 minutes"
          sleep 600
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f attempt="$((ATTEMPT + 1))"
