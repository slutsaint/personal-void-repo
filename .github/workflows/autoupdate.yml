name: autoupdate
on:
  schedule:
    - cron: '5 * * * *'   # hourly; change to '5 */6 * * *' for every 6h
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: autoupdate
  cancel-in-progress: false

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install tools
        run: sudo apt-get update && sudo apt-get install -y fish jq
      - name: check upstream for new versions
        id: updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./autoupdate.fish
      - name: commit and trigger build
        if: ${{ steps.updates.outputs.updates != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES: ${{ steps.updates.outputs.updates }}
        run: |
          git config user.name "repo-bot"
          git config user.email "repo-bot@users.noreply.github.com"
          git add -A pkgs common
          git commit -m "[automated] update packages" -m "$UPDATES"
          git push
          # pushes made with GITHUB_TOKEN don't start other workflows, so start the build explicitly
          gh workflow run build.yml --ref "${GITHUB_REF_NAME}"
